[package]
name = "agent-office-desktop"
version = "0.4.0"
description = "Agent Office desktop app: a live 3D mission control for coding agents"
license = "MIT"
edition = "2021"
publish = false

[[bin]]
name = "agent-office"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
